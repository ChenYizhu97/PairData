all:
- field: evaluation.preserved
  op: eq
  value: true
- field: evaluation.valid_prompt
  op: eq
  value: true
- field: evaluation.issues
  op: length_between
  min: 0
  max: 0
- field: evaluation.added_pius
  op: length_between
  min:
    ref: sample.expansion.min
  max:
    ref: sample.expansion.max
- not:
    field: candidate
    op: contains
    value: '```'
