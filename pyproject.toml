[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pairdata"
version = "0.0.0"
description = "Configurable source-target dataset synthesis with LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
]

[project.scripts]
pairdata = "pairdata.cli:main"

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/pairdata"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/README.en.md",
  "/README.zh-CN.md",
  "/recipes",
  "/examples",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
