[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "midasdata"
version = "0.1.6"
description = "Auditable Chinese-first visual prompt SFT generation and English expansion"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "pydantic>=2.10,<3",
]

[project.scripts]
midasdata = "midasdata.cli:main"

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/midasdata"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/config.example.toml",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
